name: Daily model tracking

on:
  schedule:
    # 每天台灣時間 18:00 執行（UTC 10:00），在 stock-system 那邊當天資料更新完之後
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # 也可以在 GitHub 網頁上手動點「Run workflow」立即跑一次

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 讓內建的 GITHUB_TOKEN 有權限 commit/push 回這個 repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline (fetch -> train if due -> predict -> track -> LINE notify)
        env:
          STOCK_SYSTEM_TOKEN: ${{ secrets.STOCK_SYSTEM_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # 沒設定這個 Secret 也沒關係：data_health.py 會印一行提醒然後跳過缺口回補/
          # close=0 修復這兩步，不會讓整條每日流程失敗（停牌偵測不需要 FinMind，不受影響）
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m src.run_daily

      - name: Commit updated tracking db / models / state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tracking.db data/train_state.json data/known_halt_windows.json models/
          git diff --cached --quiet || git commit -m "chore: daily track $(date -u +%Y-%m-%d)"
          git push
